<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EnableX | Reset Password</title>

<link rel="icon" href="assets/favicon/favicon.svg">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="aurora"></div>

<header>

<nav class="navbar">

<div class="logo">

<span class="diamond"></span>

<h2>EnableX</h2>

</div>

</nav>

</header>

<main class="auth-page">

<div class="auth-card">

<div class="auth-header">

<div class="auth-logo">

<span class="diamond large"></span>

</div>

<h1>Create New Password</h1>

<p>

Choose a strong password for your EnableX account.

</p>

</div>

<form id="resetPasswordForm">

<div class="form-group">

<label>New Password</label>

<input
type="password"
id="newPassword"
required>

</div>

<div class="form-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmNewPassword"
required>

</div>

<button
type="submit"
class="btn-primary auth-button">

Update Password

</button>

</form>

<div class="auth-footer">

<a href="login.html">

Return to Login

</a>

</div>

</div>

<div class="auth-side">

<h2>Enterprise Security</h2>

<p>

Your new password should be unique and meet your organization's password policy.

</p>

</div>

</main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
