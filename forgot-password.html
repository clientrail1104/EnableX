<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EnableX | Forgot Password</title>

<link rel="icon" href="assets/favicon/favicon.svg">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="aurora"></div>

<header>

<nav class="navbar">

<div class="logo">

<span class="diamond"></span>

<h2>EnableX</h2>

</div>

</nav>

</header>

<main class="auth-page">

<div class="auth-card">

<div class="auth-header">

<div class="auth-logo">

<span class="diamond large"></span>

</div>

<h1>Forgot Password</h1>

<p>

Enter your work email and we'll send password reset instructions.

</p>

</div>

<form id="forgotPasswordForm">

<div class="form-group">

<label>Work Email</label>

<input
type="email"
id="forgotEmail"
placeholder="name@company.com"
required>

</div>

<button
type="submit"
class="btn-primary auth-button">

Send Reset Link

</button>

</form>

<div class="auth-footer">

<p>

<a href="login.html">

← Back to Login

</a>

</p>

</div>

</div>

<div class="auth-side">

<h2>Password Recovery</h2>

<p>

A secure password reset link will be sent to your registered enterprise email.

</p>

</div>

</main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
